services:
  api-gateway:
    image: ${GATEWAY_IMAGE:-api-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host port is an example; operations may override both host IP and port.
      - "${GATEWAY_BIND_IP:-0.0.0.0}:${GATEWAY_HOST_PORT:-36016}:8888"
    volumes:
      - type: bind
        source: ${GATEWAY_CONFIG:-./config/default.toml}
        target: /app/config/default.toml
        read_only: true
        bind:
          create_host_path: false
    # The deployed exchange service uses Docker's built-in bridge, without name DNS.
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
      # Uses the existing built-in bridge; no additional Docker network is created.
