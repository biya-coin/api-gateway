[server]
# 本地开发默认只监听回环地址；部署时按需调整。
listen_addr = "127.0.0.1:8080"
shutdown_timeout_ms = 5000

[logging]
filter = "info"

[upstreams]
# 均为完整接口 URL，不自动追加 /info、/exchange 或 /ws。
# 未配置的对应路由返回 503；不会回退到其他服务。
# 网关与后端同机部署；indexer 无额外鉴权或来源 IP 白名单。
state_info = "http://localhost:3300/info"
indexer_info = "http://localhost:9090/info"
indexer_ws = "ws://localhost:9090/ws"
# 交易池只接收 /exchange，不处理 /info。
exchange = "http://localhost:18080/exchange"

[http]
connect_timeout_ms = 3000
request_timeout_ms = 10000
body_timeout_ms = 5000
write_timeout_ms = 10000
max_connections = 1024
max_request_body_bytes = 4194304
max_response_body_bytes = 16777216
max_in_flight = 128

[websocket]
handshake_timeout_ms = 5000
max_connections = 1024
# 每个方向的固定拷贝缓冲，不缓存业务消息、不限制单帧大小。
tunnel_buffer_bytes = 8192
# 0 表示允许静默订阅；非零时按双向字节活动计算空闲时间。
idle_timeout_ms = 0

[access]
# 前端当前使用这两个开发 Origin；正式域名后续再加入。
# 不启用 Cookie 凭证模式。
allowed_origins = ["http://localhost:8080", "http://127.0.0.1:8080"]