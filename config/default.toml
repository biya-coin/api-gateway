[server]
# 网关自身在容器内监听 8888；宿主机映射端口由运维配置。
listen_addr = "0.0.0.0:8888"
shutdown_timeout_ms = 5000

[logging]
filter = "info"

[upstreams]
# 均为完整接口 URL，不自动追加 /info、/exchange 或 /ws。
# 未配置的对应路由返回 503；不会回退到其他服务。
# 状态容器 bybchain-api-server-api-server-1 使用 bybchain-api-server_default 网络。
# 通过宿主机 36020 -> 状态容器 8888 访问，无需加入后端网络。
state_info = "http://host.docker.internal:36020/info"
# assetCtxs / clearinghouseState 的 WS 订阅；后端实现由状态服务提供。
state_ws = "ws://host.docker.internal:36020/ws"
# indexer 容器 biya-indexer 使用 biya-indexer_default 网络，通过宿主机映射访问。
# 9090 和 36018 均映射至容器 8888，统一使用 36018；36019 -> 8889 不用于转发。
indexer_info = "http://host.docker.internal:36018/info"
indexer_ws = "ws://host.docker.internal:36018/ws"
# 交易池只接收 /exchange，不处理 /info。
# 已部署容器：bybchain-exchange-apiserver-dev-bridge2，bridge 网络。
# 通过宿主机 36014 -> 交易容器 8888 访问；compose.yaml 提供 host-gateway 解析。
exchange = "http://host.docker.internal:36014/exchange"

[http]
connect_timeout_ms = 3000
request_timeout_ms = 10000
body_timeout_ms = 5000
write_timeout_ms = 10000
max_connections = 1024
max_request_body_bytes = 4194304
max_response_body_bytes = 16777216
max_in_flight = 128

[websocket]
handshake_timeout_ms = 5000
max_connections = 1024
# 保留原配置键，现为每条 WebSocket 的读取缓冲大小。
tunnel_buffer_bytes = 8192
# 双向单条完整消息及单帧上限，包含分片重组后的消息。
max_message_bytes = 4194304
# 0 表示允许静默订阅；非零时按客户端或上游完整消息活动计算空闲时间。
idle_timeout_ms = 0

[access]
# 允许本地开发页面、HTTPS 前端域名和 API 文档站（/docs 页内 Test Request）；Origin 精确匹配，不带路径或尾部 /。
# 域名使用默认 HTTPS 端口，不将服务器内部映射端口加入 Origin。
# 不启用 Cookie 凭证模式。
allowed_origins = ["http://localhost:8080", "http://127.0.0.1:8080", "https://dev.dex.biya.io", "https://dev.dex-api.biya.io"]